apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
- ../../base
- namespace.yaml
- backup.yaml
images:
- name: ghcr.io/antief/broadcaster
  newName: ghcr.io/antief/broadcaster
  newTag: 216e1709003e5e6e4a25037e1f41661123285587
- name: ghcr.io/antief/todo-app
  newName: ghcr.io/antief/todo-app
  newTag: 216e1709003e5e6e4a25037e1f41661123285587
- name: ghcr.io/antief/todo-backend
  newName: ghcr.io/antief/todo-backend
  newTag: 216e1709003e5e6e4a25037e1f41661123285587
patches:
- patch: |-
    - op: replace
      path: /spec/storageClassName
      value: local-path
  target:
    kind: PersistentVolumeClaim
    name: todo-image-claim
- patch: |-
    - op: add
      path: /spec/rules/0/host
      value: production.todo.local
  target:
    kind: Ingress
    name: course-ingress
- path: broadcaster.yaml
- path: backend.yaml
