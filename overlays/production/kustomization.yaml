apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
- ../../base
- namespace.yaml
- backup.yaml
images:
- name: ghcr.io/antief/todo-app
  newName: ghcr.io/antief/todo-app
  newTag: b7118e6b4ae1eca526423a826b85df7daebd4ee5
- name: ghcr.io/antief/todo-backend
  newName: ghcr.io/antief/todo-backend
  newTag: b7118e6b4ae1eca526423a826b85df7daebd4ee5
- name: ghcr.io/antief/broadcaster
  newName: ghcr.io/antief/broadcaster
  newTag: b7118e6b4ae1eca526423a826b85df7daebd4ee5
patches:
- target:
    kind: PersistentVolumeClaim
    name: todo-image-claim
  patch: |-
    - op: replace
      path: /spec/storageClassName
      value: local-path
- target:
    kind: Ingress
    name: course-ingress
  patch: |-
    - op: add
      path: /spec/rules/0/host
      value: production.todo.local
- path: broadcaster.yaml
- path: backend.yaml
