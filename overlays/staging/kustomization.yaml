apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
- ../../base
- namespace.yaml
images:
- name: ghcr.io/antief/broadcaster
  newName: ghcr.io/antief/broadcaster
  newTag: 37ba5f74d95bb13692c892ce2b4bea768d154c97
- name: ghcr.io/antief/todo-app
  newName: ghcr.io/antief/todo-app
  newTag: 37ba5f74d95bb13692c892ce2b4bea768d154c97
- name: ghcr.io/antief/todo-backend
  newName: ghcr.io/antief/todo-backend
  newTag: 37ba5f74d95bb13692c892ce2b4bea768d154c97
patches:
- patch: |-
    - op: replace
      path: /spec/storageClassName
      value: local-path
  target:
    kind: PersistentVolumeClaim
    name: todo-image-claim
- patch: |-
    - op: add
      path: /spec/rules/0/host
      value: staging.todo.local
  target:
    kind: Ingress
    name: course-ingress
- path: broadcaster.yaml
- path: backend.yaml
